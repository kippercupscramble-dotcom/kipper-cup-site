[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Filenames here are NOT content-hashed and get overwritten in place,
# so assets must revalidate. Netlify serves ETags, so unchanged files
# still return a cheap 304 rather than re-downloading.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Video rarely changes and is large — cache it hard, and allow range
# requests so browsers can seek without re-downloading.
[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Accept-Ranges = "bytes"

# Pretty URLs: /rules -> /rules.html
[[redirects]]
  from = "/rules"
  to = "/rules.html"
  status = 200

[[redirects]]
  from = "/gallery"
  to = "/gallery.html"
  status = 200

[[redirects]]
  from = "/sponsors"
  to = "/sponsors.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
